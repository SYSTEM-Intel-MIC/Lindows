<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Keep terminal ASCII cells in the normal DejaVu mono metrics.  A strong
       zh locale rule made XTerm select a CJK face for every glyph, visibly
       expanding Latin letters and spaces.  CJK glyphs fall back normally. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Zen Hei Mono</family>
      <family>monospace</family>
    </prefer>
  </alias>
</fontconfig>
